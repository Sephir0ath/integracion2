syntax = "proto3";

// ButacasService owns the seat inventory: availability, reservation and release.
// A seat row is individually identified so that the same seat can never be sold twice.
package butacas;

service ButacasService {
  rpc ListarEventos(ListarEventosRequest) returns (ListarEventosResponse);
  rpc ListarSecciones(ListarSeccionesRequest) returns (ListarSeccionesResponse);
  rpc ListarButacas(ListarButacasRequest) returns (ListarButacasResponse);
  rpc Reservar(ReservarRequest) returns (ReservaResponse);
  rpc Liberar(LiberarRequest) returns (LiberarResponse);
  rpc ConfirmarVenta(ConfirmarVentaRequest) returns (ConfirmarVentaResponse);
  rpc ConsultarReserva(ConsultarReservaRequest) returns (ReservaResponse);

  // Administracion del recinto (CRUD de eventos y secciones).
  rpc CrearEvento(CrearEventoRequest) returns (Evento);
  rpc ActualizarEvento(ActualizarEventoRequest) returns (Evento);
  rpc EliminarEvento(EliminarEventoRequest) returns (EliminarResponse);
  rpc CrearSeccion(CrearSeccionRequest) returns (Seccion);
  rpc ActualizarSeccion(ActualizarSeccionRequest) returns (Seccion);
  rpc EliminarSeccion(EliminarSeccionRequest) returns (EliminarResponse);
}

message ListarEventosRequest {}

message Evento {
  string evento_id = 1;
  string nombre = 2;
  string lugar = 3;
  string fecha = 4; // ISO-8601
}

message ListarEventosResponse {
  repeated Evento eventos = 1;
}

message ListarSeccionesRequest {
  string evento_id = 1;
}

message Seccion {
  string seccion_id = 1;
  string evento_id = 2;
  string nombre = 3;
  int32 capacidad_total = 4;
  int32 cantidad_disponible = 5;
  int64 precio_centavos = 6; // precio por entrada, en centavos; lo define el dominio
}

message ListarSeccionesResponse {
  repeated Seccion secciones = 1;
}

message Butaca {
  string butaca_id = 1;
  string seccion_id = 2;
  string fila = 3;
  int32 numero = 4;
  string estado = 5;  // LIBRE | RESERVADA | VENDIDA
  string saga_id = 6; // owner saga when RESERVADA or VENDIDA
}

message ListarButacasRequest {
  string seccion_id = 1;
}

message ListarButacasResponse {
  repeated Butaca butacas = 1;
}

message ReservarRequest {
  string saga_id = 1;
  string evento_id = 2;
  string seccion_id = 3;
  // Las butacas exactas que eligio el comprador. Se reservan una por una,
  // de forma atomica: si alguna ya no esta libre, la reserva se rechaza
  // entera (regla: una butaca no se vende dos veces).
  repeated string butaca_ids = 4;
  string idempotency_key = 5;
}

message Reserva {
  string reserva_id = 1;
  string saga_id = 2;
  string seccion_id = 3;
  repeated Butaca butacas = 4;
  string estado = 5; // ACTIVA | LIBERADA | VENDIDA
  string creada_en = 6;
  int64 precio_centavos = 7; // precio de la seccion reservada
}

message ReservaResponse {
  Reserva reserva = 1;
  repeated Butaca butacas = 2;
  string estado = 3; // ACTIVA | LIBERADA | NO_ENCONTRADA
}

message LiberarRequest {
  string saga_id = 1;
  string idempotency_key = 2;
}

// Cierre de la venta: las butacas reservadas pasan a VENDIDA cuando la saga
// termina bien. No es un paso mas de la saga, es la transicion de estado que
// completa la reserva.
message ConfirmarVentaRequest {
  string saga_id = 1;
}

message ConfirmarVentaResponse {
  bool confirmada = 1;
  int32 butacas_confirmadas = 2;
  string estado = 3; // VENDIDA | NO_ENCONTRADA
}

message LiberarResponse {
  bool liberado = 1;
  int32 butacas_liberadas = 2;
  string estado = 3; // LIBERADA | NO_ENCONTRADA
}

message ConsultarReservaRequest {
  string saga_id = 1;
}

// --- Administracion --------------------------------------------------------

message CrearEventoRequest {
  string nombre = 1;
  string lugar = 2;
  string fecha = 3; // ISO-8601
}

message ActualizarEventoRequest {
  string evento_id = 1;
  string nombre = 2;
  string lugar = 3;
  string fecha = 4;
}

message EliminarEventoRequest {
  string evento_id = 1;
}

message CrearSeccionRequest {
  string evento_id = 1;
  string nombre = 2;
  int32 capacidad_total = 3;
  int64 precio_centavos = 4;
}

message ActualizarSeccionRequest {
  string seccion_id = 1;
  string nombre = 2;
  int32 capacidad_total = 3;
  int64 precio_centavos = 4;
}

message EliminarSeccionRequest {
  string seccion_id = 1;
}

message EliminarResponse {
  bool eliminado = 1;
}
